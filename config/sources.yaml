# ---------------------------------------------------------------------------
# Research sources for the AI Newsletter Agent
#
# The research tool never crawls "the internet": it only reads the feeds and
# sitemaps listed below. `topics`/`keywords` are used to rank which sources are
# worth querying for a given set of planner research queries, `weight` nudges
# the deterministic quality score of an article.
#
# type: rss         -> parsed with feedparser (standard RSS/Atom feeds)
# type: hackernews  -> free Algolia JSON API (Hacker News search); the first
#                      `keywords` entry is the query and hits carry the real
#                      publisher URL - no redirect decoding involved
# type: sitemap     -> bounded XML sitemap crawl, articles extracted with
#                      news-please (disabled by default, opt-in)
# ---------------------------------------------------------------------------
version: 1

http:
  user_agent: "Mozilla/5.0 (compatible; AINewsletterAgent/1.0; +https://github.com/your-user/ai-newsletter-agent)"
  timeout_seconds: 20
  max_items_per_source: 25
  default_recency_window_days: 14
  max_workers: 4
  enrich_full_text: true
  enrich_limit: 12
  # When false, sitemap sources are resolved by this project (requests +
  # news-please extraction). When true, the optional news-please/scrapy
  # SitemapCrawler runs in an isolated subprocess instead.
  sitemap_use_news_please_spider: false

sources:
  # --- AI / technology news outlets -----------------------------------------
