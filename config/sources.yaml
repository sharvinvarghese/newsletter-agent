  # --- Hacker News (free Algolia JSON API, no key, no rate limits) -----------
  # type: hackernews: the first `keywords` entry is the search query, and every
  # hit carries the real publisher URL (no Google-News-style redirects).
  - id: hackernews_ai
    name: Hacker News AI
    url: https://hn.algolia.com/api/v1/search
    type: hackernews
    category: community
    topics: [ai_agents, ai_research]
    keywords: ["AI"]
    weight: 0.9
    max_items: 12

  - id: hackernews_llm
    name: Hacker News LLM
    url: https://hn.algolia.com/api/v1/search
    type: hackernews
    category: community
    topics: [ai_agents, foundation_models]
    keywords: ["LLM"]
    weight: 0.85
    max_items: 10

  # --- Sitemap based sources (opt-in, disabled by default) -------------------
  # Bounded sitemap crawling: the sitemap is read, URLs are filtered by the
  # research queries, and the matching articles are extracted with news-please.
  # Enable one by setting `enabled: true` (or by naming it in the plan).
  - id: anthropic_news
    name: Anthropic News
    url: https://www.anthropic.com/sitemap.xml
    type: sitemap
    category: ai_labs
    topics: [foundation_models, ai_agents, ai_safety]
