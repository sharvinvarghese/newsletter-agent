version: 1
newsletter:
  target_articles: 6
  min_articles: 5
  max_articles: 7
  hard_min_articles: 1
  hard_max_articles: 12
  min_sections: 1
  max_sections: 12
  output_formats:
  - html+markdown
  - html
  - markdown
  audit:
    coverage_trigger: 5
    min_covered_sections: 5
    min_summary_chars: 80
  fallback_requirements:
  - Lead with the most consequential story.
  - Summarise each story in 2-3 sentences using only the supplied source material.
  - Explain in one sentence why each story matters to the reader.
  - Keep a neutral, professional tone and avoid hype.
  - Never introduce facts, names, numbers or links that are not in the sources.
scoring:
  min_score: 0.0
  max_score: 1.0
  weights:
    relevance: 0.5
    quality: 0.3
    recency: 0.2
  min_relevance: 0.35
  min_content_chars: 400
  unknown_date_recency: 0.5
  fallback_horizon_days: 30
  title_hit_weight: 2.0
  body_hit_weight: 1.0
  keyword_hits_cap: 3
  source_weight_default: 0.6
  quality_boosters:
  - analysis
  - benchmark
  - dataset
  - documentation
  - engineering
  - evaluation
  - interview
  - open source
  - research
  - roadmap
  - study
  - technical
  quality_penalties:
  - advertorial
  - best deals
  - coupon
  - giveaway
  - horoscope
  - press release
  - sponsored
  - webinar
  - top 10
llm:
  text_chars:
    evaluation: 700
    summary: 3000
    critique: 2000
  temperatures:
    goal_parsing: 0.0
    planning: 0.2
    evaluation: 0.0
    summary: 0.1
    generation: 0.3
    revision: 0.4
    critique: 0.1
  evaluation_max_selected: 7
planning:
  min_queries: 4
  max_queries: 8
  min_requirements: 3
  max_requirements: 6
  min_collect: 10
  max_collect: 100
writing:
  max_topics: 3
  summary_min_points: 2
  summary_max_points: 4
  summary_min_sentences: 2
  summary_max_sentences: 3
  section_min_sentences: 2
  section_max_sentences: 3
  intro_min_sentences: 2
  intro_max_sentences: 3
