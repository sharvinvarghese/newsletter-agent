  min_term_length: 3
  max_terms: 60
  sitemap_child_limit: 2
  sitemap_skip_extensions:
  - .jpg
  - .jpeg
  - .png
  - .svg
  - .gif
  - .pdf
  - .zip
  - .gz
  - .mp4
  - .webp
  url_skip_fragments:
  - /tag/
  - /tags/
  - /category/
  - /author/
  - /page/
  - '#'
  - ?utm_
rendering:
  templates_dir: config/templates
  html_template: newsletter.html.j2
  markdown_template: newsletter.md.j2
  filename:
    prefix: newsletter
    subject_slug_chars: 48
    timestamp_format: '%Y%m%d-%H%M%S'
  footer:
    attribution: Compiled automatically from the linked sources listed below.
    disclaimer: AI Newsletter Agent - all facts are taken from the cited articles.
  simulated_delivery_note: 'SIMULATED SEND: no email provider is configured, so the
    issue is written to the outputs/ folder and rendered in the UI instead of being
    emailed.'
deduplication:
  title_threshold: 0.9
  jaccard_weight: 0.5
