  generic_goal_words:
  - create
  - write
  - generate
  - make
  - build
  - curate
  - summarize
  - summarise
  - newsletter
  - weekly
  - daily
  - monthly
  - please
  - about
  - with
  - that
  - latest
  - articles
  - stories
  - issues
  - issue
  - report
  - roundup
  - professional
  fallback_topic: technology news
  min_goal_chars: 5
  frequency_hints:
    daily:
    - daily
    - every day
    - each morning
    weekly:
    - weekly
    - every week
    - each week
    - this week
    biweekly:
    - biweekly
    - fortnightly
    - every two weeks
    monthly:
    - monthly
    - every month
    - this month
  default_frequency: weekly
  audience_patterns:
  - \bfor ([A-Za-z0-9 ,&/\-]{3,60})
  - \baudience of ([A-Za-z0-9 ,&/\-]{3,60})
  - \baimed at ([A-Za-z0-9 ,&/\-]{3,60})
  article_count_patterns:
  - (\d{1,2})\s*(?:articles|stories|items|pieces|sections)
  - top\s*(\d{1,2})
  human_in_loop_hints:
  - human in the loop
  - human-in-the-loop
  - approve
  - approval
  - review
  - sign off
  format_hints:
    markdown:
    - markdown
    - .md
    html:
    - html
research:
